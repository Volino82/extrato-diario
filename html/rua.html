<h2>Iniciar Rua</h2>
<form>
    <label for="agenteRua">Agente responsável pela rua</label>
    <input type="text" id="agenteRua" name="agenteRua" required>
    <label for="logradouro">Logradouro / Rua</label>
    <input type="text" id="logradouro" name="logradouro" required>   
    <label for="cep">CEP</label>
    <input type="text" id="cep" name="cep" required
        inputmode="numeric" maxlength="9" autocomplete="off"
        placeholder="00000-000">
    <label for="coordinicio">Início</label>
    <input type="text" id="coordinicio" name="coordinicio" required>
    <label for="coordfim">Fim</label>
    <input type="text" id="coordfim" name="coordfim" required>
    <input type="submit" value="Iniciar Rua">
</form>
